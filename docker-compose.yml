version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15
    container_name: exoplanet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: exoplanet_calculations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telescope-network

  # Adminer для управления БД
  adminer:
    image: adminer:latest
    container_name: exoplanet-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telescope-network

  # Go приложение
  app:
    build: .
    container_name: exoplanet-app
    ports:
      - "8081:8081"
    environment:
      DOCKER_ENV: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telescope-network

  # MinIO для хранения изображений
  minio:
    image: minio/minio:latest
    container_name: telescope-minio
    ports:
      - "9000:9000"    # API порт
      - "9001:9001"    # Web Console порт
    environment:
      MINIO_ROOT_USER: minioadmin123
      MINIO_ROOT_PASSWORD: minioadmin123456
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - telescope-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  telescope-network:
    driver: bridge
