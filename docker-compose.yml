version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: telescope-minio
    ports:
      - "9000:9000"    # API порт
      - "9001:9001"    # Web Console порт
    environment:
      MINIO_ROOT_USER: minioadmin123
      MINIO_ROOT_PASSWORD: minioadmin123456
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - telescope-network

volumes:
  minio_data:
    driver: local

networks:
  telescope-network:
    driver: bridge
